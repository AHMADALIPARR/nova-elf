<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="ver-title ver-desc">
  <title id="ver-title">Verification and Provenance Pipeline</title>
  <desc id="ver-desc">The verification contract in verify.rkt: five codec bijectivity checks over all 256 byte values, the ELF round-trip Load(ELF(M)) equals M, exhaustive GF(2^8) semantics over all 65,536 input pairs on the ELF-loaded image, and the ROMHEX round trip. Passing checks produce artifacts and evidence that NovaDag records as provenance; the hardware refinement proof remains a pending obligation, not a claim.</desc>
  <style>
    .bg { fill: #0d1117; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
    .panel-green { fill: #0f2a1a; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
    .panel-amber { fill: #2e230a; stroke: #d29922; stroke-width: 1.5; rx: 8; }
    .panel-blue { fill: #0d2137; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
    .title { fill: #e6edf3; font-family: sans-serif; font-size: 22px; font-weight: bold; }
    .subtitle { fill: #8b949e; font-family: sans-serif; font-size: 13px; }
    .label { fill: #e6edf3; font-family: sans-serif; font-size: 14px; font-weight: bold; }
    .small { fill: #c9d1d9; font-family: sans-serif; font-size: 12px; }
    .muted { fill: #8b949e; font-family: sans-serif; font-size: 12px; }
    .mono { fill: #79c0ff; font-family: monospace; font-size: 12px; }
    .ok { fill: #3fb950; font-family: sans-serif; font-size: 12px; font-weight: bold; }
    .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#ah); }
    .arrow-g { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#ahg); }
    .arrow-a { stroke: #d29922; stroke-width: 2; fill: none; marker-end: url(#aha); }
    .flow { fill: #58a6ff; font-family: sans-serif; font-size: 12px; font-style: italic; }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/></marker>
    <marker id="ahg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/></marker>
    <marker id="aha" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d29922"/></marker>
  </defs>
  <rect class="bg" width="1000" height="700"/>
  <text class="title" x="30" y="40">Verification and Provenance Pipeline</text>
  <text class="subtitle" x="30" y="62">verify.rkt, reproduced 2026-11-20 in ~13.5 s (Racket v8.15). Every check below passed; the artifacts written are byte-identical to the shipped ones.</text>

  <!-- source image -->
  <rect class="panel-blue" x="30" y="100" width="220" height="100" rx="8"/>
  <text class="label" x="48" y="128">Source image M</text>
  <text class="small" x="48" y="150">731 cells from the lowering</text>
  <text class="small" x="48" y="170">engine (gf-mul-items)</text>
  <text class="mono" x="48" y="190">sha256 153be573...</text>

  <path class="arrow" d="M 250 150 L 320 150"/>
  <text class="flow" x="258" y="135">package</text>

  <!-- ELF -->
  <rect class="panel-blue" x="320" y="100" width="220" height="100" rx="8"/>
  <text class="label" x="338" y="128">ELF64 object</text>
  <text class="small" x="338" y="150">package-subleq-image</text>
  <text class="small" x="338" y="170">4,440 bytes</text>
  <text class="mono" x="338" y="190">sha256 4c2605a5...</text>

  <path class="arrow" d="M 540 150 L 610 150"/>
  <text class="flow" x="548" y="135">load</text>

  <!-- reconstructed -->
  <rect class="panel-green" x="610" y="100" width="220" height="100" rx="8"/>
  <text class="label" x="628" y="128">Reconstructed M'</text>
  <text class="small" x="628" y="150">load-subleq-image</text>
  <text class="small" x="628" y="170">731 cells</text>
  <text class="ok" x="628" y="190">M' = M: ok</text>

  <!-- check 1 -->
  <rect class="panel-green" x="30" y="240" width="460" height="110" rx="8"/>
  <text class="label" x="48" y="268">Check 1 — Codec bijectivity</text>
  <text class="mono" x="48" y="290">D_c(E_c(B)) = B, all 256 byte values</text>
  <text class="small" x="48" y="312">HEX16, BASE32, BASE64, BASE256, BASE512</text>
  <text class="ok" x="48" y="334">ok HEX16 / BASE32 / BASE64 / BASE256 / BASE512 bijective</text>

  <!-- check 2 -->
  <rect class="panel-green" x="510" y="240" width="460" height="110" rx="8"/>
  <text class="label" x="528" y="268">Check 2 — ELF round trip</text>
  <text class="mono" x="528" y="290">Load(ELF(M)) = M, byte-identical</text>
  <text class="small" x="528" y="312">plus ELF bytes through HEX16, BASE64, BASE32</text>
  <text class="ok" x="528" y="334">ok ELF loader preserves image; ok ELF via HEX16 / BASE64 / BASE32</text>

  <!-- check 3 -->
  <rect class="panel-green" x="30" y="370" width="460" height="130" rx="8"/>
  <text class="label" x="48" y="398">Check 3 — GF semantics, exhaustive</text>
  <text class="small" x="48" y="420">Run the ELF-loaded image on all 65,536 (a, b) pairs;</text>
  <text class="small" x="48" y="440">each run must halt and out-r must equal gf-mul-ref.</text>
  <text class="mono" x="48" y="462">mismatches = 0 / 65536</text>
  <text class="ok" x="48" y="484">ok GF semantics preserved through ELF</text>

  <!-- check 4 -->
  <rect class="panel-green" x="510" y="370" width="460" height="130" rx="8"/>
  <text class="label" x="528" y="398">Check 4 — ROMHEX round trip</text>
  <text class="mono" x="528" y="420">decode(encode(cells)) = cells</text>
  <text class="small" x="528" y="442">731 lines, word-addressed, two's complement</text>
  <text class="ok" x="528" y="464">ok ROMHEX round-trip; ROMHEX lines = 731</text>
  <text class="muted" x="528" y="486">artifacts written to artifact/</text>

  <!-- provenance -->
  <path class="arrow-a" d="M 260 500 L 260 560"/>
  <path class="arrow-a" d="M 740 500 L 740 560"/>
  <rect class="panel-amber" x="30" y="560" width="940" height="110" rx="8"/>
  <text class="label" x="48" y="588">Provenance — what leaves this repo (evidence, not proof)</text>
  <text class="small" x="48" y="612">manifest.json records the image digest, ELF digest, encoding digests, the exhaustive result, the Rosette results (from the lowering engine),</text>
  <text class="small" x="48" y="632">and the DAG node id. NovaDag ingests this evidence as node subleq.gf256.mul.v1.</text>
  <text class="muted" x="48" y="654">Pending, not claimed: hardware refinement (VHDL implements the SUBLEQ model), a formal ELF loader/codec proof, and constant-time behavior.</text>
</svg>
